name: Patch and Release OTA for Multiple Devices

# Fans out one `release.yml` run per device and flavor.
# A single device fork sets no `DEVICES` and gets one run built from
# `DEVICE_NAME`, `ROOT` and `MAGISK_PREINIT` in env.toml.

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'Comma-separated entries of `device:preinit:root`, the last two optional. For example: "bluejay:sda8, panther", or "oriole:metadata:true, oriole::false" to build both flavors of one device. When an entry omits root, the `root` input decides; a rooted entry needs its own preinit. Leave empty to use `DEVICES` from env.toml'
        required: false
      root:
        description: Add root to the builds
        required: false
        type: boolean
        default: false
      update-channel:
        description: GrapheneOS update channel. Supports `alpha`, `beta` and `stable`. Defaults to `stable`
        required: false
      release-type:
        description: 'How to handle the release. `default`: build and publish if new. `build-only`: only build. `force-publish`: build and publish even if it exists.'
        required: true
        type: choice
        options:
          - default
          - build-only
          - force-publish
        default: default

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.parse.outputs.devices }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Parse device list
        id: parse
        env:
          DEVICES_INPUT: ${{ inputs.devices }}
          ROOT_INPUT: ${{ inputs.root }}
        run: |
          source src/util_functions.sh && check_toml_env

          # The same expansion a local build uses, so both agree on what a list
          # means. The input wins on a manual run; on a schedule there is none and
          # env.toml decides
          entry_list=$(parse_devices "${ROOT_INPUT}" "${DEVICES_INPUT}")

          devices=$(jq -Rcn '[inputs | split(":") | {device: .[0], preinit: .[1], root: (.[2] == "true")}]' <<<"${entry_list}")

          echo "devices=$devices" >> $GITHUB_OUTPUT

  release:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.devices) }}
    permissions: write-all
    uses: ./.github/workflows/release.yml
    with:
      device-id: ${{ matrix.target.device }}
      root: ${{ matrix.target.root }}
      magisk-preinit-device: ${{ matrix.target.preinit }}
      update-channel: ${{ inputs.update-channel }}
      # A scheduled run has no inputs to pass through
      release-type: ${{ inputs.release-type || 'default' }}
    secrets: inherit
